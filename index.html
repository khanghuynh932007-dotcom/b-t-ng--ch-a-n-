<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For PNAX ❤️</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    height:100vh;
    overflow:hidden;
    background:white;
    font-family:"Segoe UI", sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
}


/* INTRO */

.intro{
    position:absolute;
    color:#ff6fa5;
    font-size:38px;
    font-weight:600;
    text-align:center;
    animation:introHide 2s forwards;
    animation-delay:2s;
}


@keyframes introHide{
    from{
        opacity:1;
    }
    to{
        opacity:0;
    }
}



/* COUNTDOWN */

.count{
    position:absolute;
    font-size:120px;
    font-weight:bold;
    color:#ff6fa5;
    opacity:0;
}


.show3{
    animation:number 1s forwards;
}

.show2{
    animation:number 1s forwards;
    animation-delay:1s;
}

.show1{
    animation:number 1s forwards;
    animation-delay:2s;
}


@keyframes number{

    0%{
        opacity:0;
        transform:scale(.5);
    }

    30%{
        opacity:1;
        transform:scale(1.2);
    }

    100%{
        opacity:0;
        transform:scale(1);
    }

}



/* CARD */

.card{

    text-align:center;
    opacity:0;
    animation:appear 2s forwards;
    animation-delay:5s;
    position:relative;

}


@keyframes appear{

    from{
        opacity:0;
        transform:scale(.7);
    }

    to{
        opacity:1;
        transform:scale(1);
    }

}



.photo{

    width:320px;
    max-width:80vw;
    border-radius:25px;

    box-shadow:
    0 0 40px rgba(255,120,170,.5);

}



.name{

    margin-top:20px;
    font-size:38px;
    color:#ff5c91;
    font-weight:bold;

}



.message{

    margin:20px auto;
    max-width:380px;
    font-size:18px;
    color:#555;
    line-height:1.7;

}



/* HEART */

.heart{

    position:absolute;
    font-size:35px;
    animation:heartMove 3s infinite ease-in-out;

}



@keyframes heartMove{

    50%{
        transform:
        translateY(-30px)
        rotate(20deg)
        scale(1.2);
    }

}



/* PETALS */

.petal{

    position:absolute;
    top:-50px;
    font-size:30px;
    animation:fall linear infinite;

}


@keyframes fall{

    from{
        transform:
        translateY(-50px)
        rotate(0deg);
        opacity:1;
    }


    to{

        transform:
        translateY(110vh)
        rotate(360deg);

        opacity:.3;

    }

}



/* SPARK */

.spark{

    position:absolute;
    width:6px;
    height:6px;
    background:#ffd1e1;
    border-radius:50%;
    animation:sparkle 2s infinite;

}



@keyframes sparkle{

    50%{

        opacity:.2;
        transform:scale(2);

    }

}


</style>

</head>


<body>


<div class="intro">

Chuẩn bị chưa người đẹp của Huỳnh Duy Khang? ❤️

</div>



<div class="count show3">
3
</div>

<div class="count show2">
2
</div>

<div class="count show1">
1
</div>




<div class="card">


<img class="photo" src="Xuân Xuân.jpg">


<div class="name">
PNAX ❤️
</div>


<div class="message">

Xuân Xuân...

<br><br>

Xinh đẹp nhất trên đời này

❤️

</div>



<div class="heart" style="top:-40px;left:-60px">
❤️
</div>


<div class="heart" style="top:30px;right:-70px;animation-delay:1s">
💖
</div>


<div class="heart" style="bottom:10px;left:-50px;animation-delay:.5s">
💕
</div>


<div class="heart" style="bottom:-30px;right:-50px;animation-delay:1.5s">
❤️
</div>



</div>




<script>


/* tạo hoa đào */

for(let i=0;i<25;i++){

let petal=document.createElement("div");

petal.className="petal";

petal.innerHTML="🌸";

petal.style.left=Math.random()*100+"vw";

petal.style.animationDuration=
(5+Math.random()*5)+"s";

petal.style.animationDelay=
Math.random()*5+"s";


document.body.appendChild(petal);

}



/* tạo hạt sáng */

for(let i=0;i<100;i++){

let s=document.createElement("div");

s.className="spark";

s.style.left=Math.random()*100+"vw";

s.style.top=Math.random()*100+"vh";

s.style.animationDelay=
Math.random()*2+"s";


document.body.appendChild(s);

}


</script>


</body>
</html>
