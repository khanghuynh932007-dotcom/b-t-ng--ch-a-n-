<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For PNAX ❤️</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    height:100vh;
    overflow:hidden;
    background:#fff;
    font-family:"Segoe UI", sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
}

.intro{
    position:absolute;
    font-size:25px;
    color:#777;
    animation:fadeOut 3s forwards;
}

@keyframes fadeOut{
    0%,60%{opacity:1;}
    100%{opacity:0;}
}


.card{
    text-align:center;
    opacity:0;
    animation:appear 2s ease forwards;
    animation-delay:3s;
    position:relative;
}

@keyframes appear{
    from{
        opacity:0;
        transform:scale(.7);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}


.photo{
    width:320px;
    max-width:80vw;
    border-radius:25px;
    box-shadow:
    0 0 30px rgba(255,120,170,.5);
}


.name{
    margin-top:20px;
    font-size:32px;
    color:#ff5c91;
}


.message{
    margin-top:15px;
    font-size:18px;
    color:#555;
    max-width:350px;
    line-height:1.6;
}


.heart{
    position:absolute;
    font-size:30px;
    animation:float 3s infinite ease-in-out;
    filter:drop-shadow(0 0 8px pink);
}


@keyframes float{
    0%,100%{
        transform:translateY(0) rotate(0);
    }
    50%{
        transform:translateY(-25px) rotate(20deg);
    }
}


.spark{
    position:absolute;
    width:6px;
    height:6px;
    background:#ffd1e1;
    border-radius:50%;
    animation:sparkle 2s infinite;
}


@keyframes sparkle{
    50%{
        opacity:.2;
        transform:scale(2);
    }
}


</style>

</head>

<body>


<div class="intro">
    Có một điều đặc biệt dành cho bạn...
</div>


<div class="card">

    <img class="photo" src="pnax.jpg">

    <div class="name">
        PNAX ❤️
    </div>


    <div class="message">
        Có thể mình không nói điều này mỗi ngày,
        nhưng bạn là một người rất đặc biệt với mình.
        <br><br>
        Mong rằng nụ cười của bạn sẽ luôn xuất hiện.
        ❤️
    </div>


    <div class="heart" style="top:-40px;left:-50px">
        ❤️
    </div>

    <div class="heart" style="top:20px;right:-60px;animation-delay:1s">
        💖
    </div>

    <div class="heart" style="bottom:20px;left:-50px;animation-delay:.5s">
        💕
    </div>

    <div class="heart" style="bottom:-30px;right:-40px;animation-delay:1.5s">
        ❤️
    </div>

</div>


<script>

for(let i=0;i<80;i++){

let s=document.createElement("div");

s.className="spark";

s.style.left=Math.random()*100+"vw";
s.style.top=Math.random()*100+"vh";

s.style.animationDelay=Math.random()*2+"s";

document.body.appendChild(s);

}

</script>


</body>
</html>
